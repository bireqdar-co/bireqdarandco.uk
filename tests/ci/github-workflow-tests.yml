name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: tester
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tester"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tester:tester@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit, database and API tests
        run: npm test
      - name: Install Playwright and Chromium (test-only, not saved to package.json)
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Browser end-to-end tests
        run: npm run test:e2e
      - name: Upload screenshots and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: testing/evidence/
      - name: Dependency audit (report only)
        run: npm audit --omit=dev || true
