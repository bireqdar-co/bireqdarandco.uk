services:
  - type: web
    name: bireqdar-storefront
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/store
    disk:
      name: bireqdar-store-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: DATABASE_URL
        sync: false
      - key: LIVE_CHECKOUT_ENABLED
        value: "false"
      - key: ADMIN_SETUP_KEY
        generateValue: true
      # Private staff studio address, e.g. atelier-<long random letters/digits>.
      # Studio URL becomes https://<your-domain>/<ADMIN_PATH>; /admin.html is disabled.
      - key: ADMIN_PATH
        sync: false
      # Encrypts staff authenticator secrets at rest. Do not change once set.
      - key: STAFF_MFA_KEY
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
